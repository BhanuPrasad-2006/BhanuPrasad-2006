<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="DVR/NVR Forensic Analysis Tool — deleted footage recovery, face detection and search, chain of custody">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b11"/><stop offset="1" stop-color="#0a0e14"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#ff2e88"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ff2e88" stroke-opacity=".06"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="600" height="330" rx="14"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace; }
    .row { animation: in .6s ease-out backwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-10px) } to { opacity: 1; transform: none } }
    .blink { animation: blink 1.2s steps(1) infinite; } @keyframes blink { 50% { opacity: 0 } }
    .spin { animation: spin 10s linear infinite; transform-box: fill-box; transform-origin: center; } @keyframes spin { to { transform: rotate(360deg) } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="600" height="330" fill="url(#bg)"/>
    <rect width="600" height="330" fill="url(#grid)"/>
    <rect width="600" height="3" fill="url(#edge)"/>
    <rect y="3" width="600" height="60" fill="url(#edge)" opacity=".05"/>
    
    <g>
      <rect x="420" y="76" width="158" height="118" rx="6" fill="#050809" stroke="#ff2e88" stroke-opacity=".6"/>
      <g stroke="#ff2e88" stroke-opacity=".12"><line x1="420" y1="82" x2="578" y2="82"/><line x1="420" y1="88" x2="578" y2="88"/><line x1="420" y1="94" x2="578" y2="94"/><line x1="420" y1="100" x2="578" y2="100"/><line x1="420" y1="106" x2="578" y2="106"/><line x1="420" y1="112" x2="578" y2="112"/><line x1="420" y1="118" x2="578" y2="118"/><line x1="420" y1="124" x2="578" y2="124"/><line x1="420" y1="130" x2="578" y2="130"/><line x1="420" y1="136" x2="578" y2="136"/><line x1="420" y1="142" x2="578" y2="142"/><line x1="420" y1="148" x2="578" y2="148"/><line x1="420" y1="154" x2="578" y2="154"/><line x1="420" y1="160" x2="578" y2="160"/><line x1="420" y1="166" x2="578" y2="166"/><line x1="420" y1="172" x2="578" y2="172"/><line x1="420" y1="178" x2="578" y2="178"/><line x1="420" y1="184" x2="578" y2="184"/></g>
      <circle class="blink" cx="434" cy="90" r="4.5" fill="#ff3b3b"/>
      <text x="444" y="94" font-size="10" fill="#ff6b6b">REC · CAM-03</text>
      <text x="570" y="186" font-size="9" fill="#8b949e" text-anchor="end">DHAV · carved</text>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;60 8;90 -6;30 4;0 0" dur="6s" repeatCount="indefinite"/>
        <circle cx="454" cy="132" r="11" fill="#8b949e" fill-opacity=".45"/>
        <path d="M438 172 q16 -26 32 0" fill="#8b949e" fill-opacity=".35"/>
        <rect x="439" y="116" width="30" height="32" fill="none" stroke="#00ff9c" stroke-width="2"/>
        <text x="439" y="112" font-size="9" fill="#00ff9c">face</text>
      </g>
      <g font-size="10" fill="#00e5ff" opacity=".85">
        <text x="420" y="216">0x3F2A00  00 00 01 BA 44 00</text>
        <text x="420" y="230">0x3F2A10  44 48 41 56 fd 1c</text>
        <rect x="482" y="206" width="92" height="13" fill="#00e5ff" fill-opacity=".15">
          <animate attributeName="y" values="206;220;206" dur="2.4s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="420" y="250" font-size="10" fill="#ff2e88">SHA-256 ✓  chain-of-custody ✓</text>
    </g>
    <circle class="blink" cx="34" cy="38" r="5" fill="#ff2e88"/>
    <text x="48" y="43" font-size="12" fill="#ff2e88" letter-spacing="1.5">SIH 2026 · NTRO · SIH26150</text>
    <text x="28" y="100" font-size="24" font-weight="700" fill="#e6edf3" filter="url(#glow)">DVR/NVR Forensics</text>
    <rect x="28" y="112" width="64" height="2.5" fill="url(#edge)"/>
    <g class="row" style="animation-delay:0.25s"><text x="28" y="150" font-size="13.5" fill="#ff2e88">▸</text><text x="46" y="150" font-size="13.5" fill="#e6edf3">Recover deleted CCTV footage from disks</text></g>
<g class="row" style="animation-delay:0.43s"><text x="28" y="180" font-size="13.5" fill="#ff2e88">▸</text><text x="46" y="180" font-size="13.5" fill="#e6edf3">AI face detection + search by photo</text></g>
<g class="row" style="animation-delay:0.61s"><text x="28" y="210" font-size="13.5" fill="#ff2e88">▸</text><text x="46" y="210" font-size="13.5" fill="#e6edf3">Object &amp; motion analytics · timelines</text></g>
<g class="row" style="animation-delay:0.79s"><text x="28" y="240" font-size="13.5" fill="#ff2e88">▸</text><text x="46" y="240" font-size="13.5" fill="#e6edf3">Hashing, audit chain, court reports</text></g>
    <g transform="translate(28 284)"><rect width="60" height="24" rx="5" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="30" y="16.5" text-anchor="middle" font-size="12" fill="#00e5ff">Python</text></g>
<g transform="translate(96 284)"><rect width="67" height="24" rx="5" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="34" y="16.5" text-anchor="middle" font-size="12" fill="#00e5ff">FastAPI</text></g>
<g transform="translate(171 284)"><rect width="60" height="24" rx="5" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="30" y="16.5" text-anchor="middle" font-size="12" fill="#00e5ff">OpenCV</text></g>
<g transform="translate(238 284)"><rect width="60" height="24" rx="5" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="30" y="16.5" text-anchor="middle" font-size="12" fill="#00e5ff">FFmpeg</text></g>
<g transform="translate(306 284)"><rect width="60" height="24" rx="5" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".55"/><text x="30" y="16.5" text-anchor="middle" font-size="12" fill="#00e5ff">Docker</text></g>
  </g>
  <rect x="1" y="1" width="598" height="328" rx="13" fill="none" stroke="url(#edge)" stroke-opacity=".6"/>
</svg>
