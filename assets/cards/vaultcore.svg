<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="VaultCore — banking backend with real-time Isolation Forest fraud scoring">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b11"/><stop offset="1" stop-color="#0a0e14"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ff2e88"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffd166" stroke-opacity=".06"/></pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="600" height="330" rx="14"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace; }
    .row { opacity: 0; animation: in .6s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-10px) } to { opacity: 1; transform: none } }
    .blink { animation: blink 1.2s steps(1) infinite; } @keyframes blink { 50% { opacity: 0 } }
    .spin { animation: spin 10s linear infinite; transform-box: fill-box; transform-origin: center; } @keyframes spin { to { transform: rotate(360deg) } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="600" height="330" fill="url(#bg)"/>
    <rect width="600" height="330" fill="url(#grid)"/>
    <rect width="600" height="3" fill="url(#edge)"/>
    <rect y="3" width="600" height="60" fill="url(#edge)" opacity=".05"/>
    
    <g>
      <path d="M426 175 A74 74 0 0 1 477.1 104.7" fill="none" stroke="#00ff9c" stroke-width="10"/>
      <path d="M477.1 104.7 A74 74 0 0 1 522.9 104.7" fill="none" stroke="#ffd166" stroke-width="10"/>
      <path d="M522.9 104.7 A74 74 0 0 1 574 175" fill="none" stroke="#ff2e88" stroke-width="10"/>
      <g font-size="9.5">
        <text x="422" y="193" fill="#00ff9c">ALLOW</text>
        <text x="500" y="87" text-anchor="middle" fill="#ffd166">2FA</text>
        <text x="578" y="193" text-anchor="end" fill="#ff2e88">FREEZE</text>
      </g>
      <g>
        <line x1="500" y1="175" x2="500" y2="115" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="-70 500 175;-20 500 175;10 500 175;72 500 175;-70 500 175" keyTimes="0;.3;.5;.75;1" dur="6s" repeatCount="indefinite"/>
      </g>
      <circle cx="500" cy="175" r="7" fill="#e6edf3"/>
      <text x="500" y="215" text-anchor="middle" font-size="11" fill="#8b949e">ML risk score</text>
    </g>
    <circle class="blink" cx="34" cy="38" r="5" fill="#ffd166"/>
    <text x="48" y="43" font-size="12" fill="#ffd166" letter-spacing="1.5">FINTECH · FRAUD DETECTION</text>
    <text x="28" y="100" font-size="24" font-weight="700" fill="#e6edf3" filter="url(#glow)">VaultCore</text>
    <rect x="28" y="112" width="64" height="2.5" fill="url(#edge)"/>
    <g class="row" style="animation-delay:0.25s"><text x="28" y="150" font-size="13.5" fill="#ffd166">▸</text><text x="46" y="150" font-size="13.5" fill="#e6edf3">Real-time ML risk score per withdrawal</text></g>
<g class="row" style="animation-delay:0.43s"><text x="28" y="180" font-size="13.5" fill="#ffd166">▸</text><text x="46" y="180" font-size="13.5" fill="#e6edf3">Allow · step-up 2FA · freeze account</text></g>
<g class="row" style="animation-delay:0.61s"><text x="28" y="210" font-size="13.5" fill="#ffd166">▸</text><text x="46" y="210" font-size="13.5" fill="#e6edf3">Device fingerprinting · AES-256</text></g>
<g class="row" style="animation-delay:0.79s"><text x="28" y="240" font-size="13.5" fill="#ffd166">▸</text><text x="46" y="240" font-size="13.5" fill="#e6edf3">Live WebSocket threat alerts</text></g>
    <g transform="translate(28 284)"><rect width="67" height="24" rx="5" fill="#ff2e88" fill-opacity=".08" stroke="#ff2e88" stroke-opacity=".55"/><text x="34" y="16.5" text-anchor="middle" font-size="12" fill="#ff2e88">Node.js</text></g>
<g transform="translate(103 284)"><rect width="105" height="24" rx="5" fill="#ff2e88" fill-opacity=".08" stroke="#ff2e88" stroke-opacity=".55"/><text x="53" y="16.5" text-anchor="middle" font-size="12" fill="#ff2e88">scikit-learn</text></g>
<g transform="translate(216 284)"><rect width="90" height="24" rx="5" fill="#ff2e88" fill-opacity=".08" stroke="#ff2e88" stroke-opacity=".55"/><text x="45" y="16.5" text-anchor="middle" font-size="12" fill="#ff2e88">PostgreSQL</text></g>
<g transform="translate(314 284)"><rect width="67" height="24" rx="5" fill="#ff2e88" fill-opacity=".08" stroke="#ff2e88" stroke-opacity=".55"/><text x="34" y="16.5" text-anchor="middle" font-size="12" fill="#ff2e88">MongoDB</text></g>
  </g>
  <rect x="1" y="1" width="598" height="328" rx="13" fill="none" stroke="url(#edge)" stroke-opacity=".6"/>
</svg>
